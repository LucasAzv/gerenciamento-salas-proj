spring.application.name=gerenciamento-salas
server.port=8082


spring.datasource.url=jdbc:postgresql://localhost:5432/gerenciamento_salas
spring.datasource.username=postgres
spring.datasource.password=postgres


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


app.jwt.secret=minha-chave-super-secreta-impossivel-de-ser-quebrada

spring.ai.openai.api-key=${GROQ_API_KEY}

spring.ai.openai.base-url=https://api.groq.com/openai

spring.ai.openai.chat.completions-path=/v1/chat/completions

spring.ai.openai.chat.options.model=openai/gpt-oss-20b

spring.ai.openai.chat.options.temperature=0.2

spring.ai.retry.max-attempts=2

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
